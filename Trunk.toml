trunk-version = "=0.21.14"

[build]
target = "app/index.html"
dist = "dist"
public_url = "/"
filehash = true
minify = "on_release"

[watch]
watch = ["app", "shared", "xtask", "content", "site.toml", "Cargo.toml"]

[[hooks]]
stage = "post_build"
command = "cargo"
command_arguments = ["run", "--locked", "--quiet", "--package", "xtask", "--", "content"]

[tools]
wasm_bindgen = "0.2.126"
wasm_opt = "version_123"
