[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
shared = { path = "../shared", default-features = false }
wasm-bindgen = { version = "=0.2.126", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
js-sys = { version = "0.3", default-features = false }
web-sys = { version = "0.3", default-features = false, features = ["Window", "Document", "DocumentFragment", "Element", "HtmlElement", "HtmlInputElement", "Storage", "Navigator", "Clipboard", "MediaQueryList", "History", "Location", "ScrollRestoration", "Performance", "Event", "EventTarget", "MouseEvent", "KeyboardEvent", "NodeList", "DomTokenList", "FocusOptions", "Animation", "CssStyleDeclaration", "DomRect", "Url", "UrlSearchParams", "Response", "DomParser", "HtmlHeadElement"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
lol_alloc = "=0.4.1"
