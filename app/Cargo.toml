[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "=0.8.21", features = ["csr"] }
leptos_router = "=0.8.16"
leptos_meta = "=0.8.7"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Storage", "Navigator", "Clipboard", "MediaQueryList", "History", "Location", "ScrollRestoration", "Performance", "EventTarget", "MouseEvent", "KeyboardEvent", "CompositionEvent", "NodeList", "DomTokenList", "FocusOptions", "Animation", "CssStyleDeclaration", "DomRect"] }
