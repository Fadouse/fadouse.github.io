[workspace]
members = ["app", "shared", "xtask"]
default-members = ["shared", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "shared" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
